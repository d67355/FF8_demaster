# 放到仓库的 .github/workflows/build.yml
# 推上去后 GitHub 会自动编译，产物在 Actions 页面下载，不用装任何软件
name: build-dll

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg integrate install

      - name: Build
        run: >
          msbuild ff8_demaster.sln /m
          /p:Configuration=Release
          /p:Platform=x86
          /p:OutDir="${{ github.workspace }}\.build\Release\\"
          /p:PostBuildEventUseInBuild=false

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ff8_demaster
          path: .build/Release/ff8_demaster.dll
          if-no-files-found: error
