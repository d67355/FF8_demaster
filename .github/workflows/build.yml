# 放到仓库的 .github/workflows/build.yml
# 注意：本项目只有 Debug 配置（没有 Release），vendor/lib 里也只提供 *Debug.lib
name: build-dll

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          C:\vcpkg\vcpkg integrate install

      - name: Build
        run: >
          msbuild ff8_demaster.sln /m
          /p:Configuration=Debug
          /p:Platform=x86
          /p:VcpkgRoot=C:\vcpkg
          /p:OutDir=${{ github.workspace }}/.build/out/
          /p:PostBuildEventUseInBuild=false

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ff8_demaster
          path: .build/out/ff8_demaster.dll
          if-no-files-found: error
